services:
  portfolio-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: abhay0263/portfolio-web:latest
    container_name: abhay-portfolio
    restart: always
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 3s
      retries: 3
